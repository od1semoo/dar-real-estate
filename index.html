<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دار العقارية | ابحث عن عقار أحلامك</title>

  <!-- خط كايرو الفاخر -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- كود التنسيق والألوان الفاخرة (CSS) -->
  <style>
    :root {
      --primary: #0f172a;
      /* كحلي داكن فاخر */
      --accent: #c29b38;
      /* ذهبي ملكي للأزرار والتفاصيل */
      --accent-hover: #a37f2d;
      /* ذهبي داكن عند التمرير */
      --text-dark: #334155;
      --text-light: #f8fafc;
      --bg-light: #f1f5f9;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* الهيدر وشريط التنقل */
    header {
      background: var(--primary);
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }

    .logo {
      color: var(--text-light);
      font-size: 24px;
      font-weight: 700;
    }

    .logo span {
      color: var(--accent);
    }

    header nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-right: 20px;
      font-weight: 600;
      transition: color 0.3s;
    }

    header nav a:hover {
      color: var(--accent);
    }

    /* واجهة الهيرو والبحث */
    .hero {
      background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://unsplash.com') no-repeat center center/cover;
      min-height: 65vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .hero-content h1 {
      font-size: 42px;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .hero-content p {
      font-size: 18px;
      color: #cbd5e1;
      margin-bottom: 35px;
    }

    /* صندوق الفلترة المتقدم */
    .search-container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      align-items: center;
    }

    .search-group {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .search-group label {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .search-group select,
    .search-group input {
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      color: var(--primary);
      background: #f8fafc;
      transition: border 0.3s;
    }

    .search-group select:focus,
    .search-group input:focus {
      border-color: var(--accent);
    }

    /* قسم شبكة العقارات */
    .properties-section {
      padding: 80px 5%;
    }

    .section-title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 50px;
      color: var(--primary);
    }

    .section-title::after {
      content: '';
      display: block;
      width: 70px;
      height: 4px;
      background: var(--accent);
      margin: 12px auto 0;
      border-radius: 2px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    /* كروت العقارات */
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      border: 1px solid #e2e8f0;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow);
    }

    .card-img {
      height: 230px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: var(--accent);
      color: var(--text-light);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .card-body {
      padding: 25px;
      text-align: right;
    }

    .card-price {
      color: var(--accent);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--primary);
      line-height: 1.5;
    }

    .card-location {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .card-features {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
      padding-top: 15px;
      font-size: 13px;
      color: #475569;
    }

    /* قسم آراء العملاء */
    .trust-section {
      background: var(--primary);
      color: var(--text-light);
      padding: 80px 5%;
      text-align: center;
    }

    .testimonials {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }

    .testi-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 30px;
      border-radius: 12px;
      border-top: 4px solid var(--accent);
      text-align: right;
    }

    .testi-card p {
      line-height: 1.7;
      color: #e2e8f0;
    }

    .client-name {
      margin-top: 20px;
      color: var(--accent);
      font-weight: 600;
    }

    /* النافذة المنبثقة (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      border-radius: 16px;
      max-width: 750px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: var(--shadow);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .close-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 30px;
      cursor: pointer;
      color: var(--primary);
      z-index: 10;
      background: #fff;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .modal-slider {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding: 20px;
      background: #f8fafc;
    }

    .modal-slider img {
      width: 85%;
      height: 320px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 30px;
      text-align: right;
    }

    .modal-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 25px 0;
      background: #f8fafc;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    /* نموذج الحجز السريع */
    .booking-form {
      margin-top: 30px;
      border-top: 2px dashed #cbd5e1;
      padding-top: 25px;
    }

    .booking-form h4 {
      margin-bottom: 20px;
      font-size: 20px;
      color: var(--primary);
    }

    .form-input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
